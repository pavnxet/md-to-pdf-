<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-Notes PDF Studio Pro — Responsive Academic Compiler</title>
    
    <!-- Tailwind CSS for high fidelity responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for premium icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for multilingual academic-grade typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Fira+Code:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Marked.js for fast Markdown compilation -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- html2pdf.js for multi-page native rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Highlight.js for beautiful syntax highlighted code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/languages/cpp.min.js"></script>
    
    <!-- KaTeX for ultra-fast, elegant math LaTeX formula processing -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <!-- Mermaid.js for advanced visual charts and mindmaps -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.2.4/dist/mermaid.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Devanagari', 'sans-serif'],
                        serif: ['Lora', 'Noto Sans Devanagari', 'serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            950: '#0f071a',
                        },
                        panel: {
                            sidebar: '#0d1527',
                            editor: '#080d1a',
                            preview: '#111827',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
            background-color: #030712;
        }

        /* Paper preview canvas wrapper styles */
        .pdf-page-preview {
            background: #ffffff;
            color: #1e293b;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            transition: all 0.2s ease-in-out;
            max-width: 100%;
        }

        /* Responsive adaptation for small screen viewports */
        @media (max-width: 768px) {
            .pdf-page-preview {
                width: 100% !important;
                min-height: auto !important;
                padding: 15px !important;
                box-shadow: none;
                border-radius: 8px;
            }
        }

        /* Detailed Academic Markdown Elements styling rules */
        .markdown-body {
            line-height: 1.68;
            font-size: 14.5px;
            color: #1e293b;
        }

        /* Custom fonts toggle for document preview */
        .font-style-sans { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; }
        .font-style-serif { font-family: 'Lora', 'Noto Sans Devanagari', serif; }

        .markdown-body h1 {
            font-size: 26px;
            font-weight: 800;
            margin-top: 24px;
            margin-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 6px;
            color: #111827;
        }

        .markdown-body h2 {
            font-size: 20px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 4px;
            color: #1f2937;
        }

        .markdown-body h3 {
            font-size: 16.5px;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 8px;
            color: #374151;
        }

        .markdown-body p {
            margin-bottom: 14px;
        }

        .markdown-body strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* Blockquotes Styling */
        .markdown-body blockquote {
            border-left: 5px solid #9333ea;
            background-color: #faf5ff;
            padding: 12px 18px;
            margin: 18px 0;
            border-radius: 0 10px 10px 0;
            font-style: italic;
            color: #581c87;
        }

        /* Structured Tables Style rules */
        .markdown-body table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
            border-spacing: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .markdown-body th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            font-size: 13.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        .markdown-body td {
            padding: 10px 16px;
            font-size: 13.5px;
            border-bottom: 1px solid #f1f5f9;
        }

        .markdown-body tr:nth-child(even) td {
            background-color: #fdfdfd;
        }

        /* Syntax Highlight Code Block override */
        .markdown-body pre {
            background-color: #0f172a !important;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 18px 0;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            border: 1px solid #1e293b;
        }

        .markdown-body code {
            font-family: 'Fira Code', monospace;
            background-color: #f1f5f9;
            color: #db2777;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .markdown-body pre code {
            background-color: transparent !important;
            color: inherit;
            padding: 0;
            font-size: inherit;
        }

        /* Lists */
        .markdown-body ul, .markdown-body ol {
            padding-left: 24px;
            margin-bottom: 14px;
        }

        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li { margin-bottom: 6px; }

        /* GFM Task List Styling */
        .markdown-body .task-list-item {
            list-style-type: none;
            padding-left: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .markdown-body .task-list-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #9333ea;
            cursor: default;
        }

        /* Math and KaTeX display */
        .katex-display {
            padding: 8px 0;
            margin: 12px 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        /* Page breaks and compiling optimizations */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            page-break-after: avoid !important;
            break-after: avoid !important;
        }

        .markdown-body p, .markdown-body li, .markdown-body blockquote, .markdown-body pre, .markdown-body tr {
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }

        /* Smooth scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-100 antialiased overflow-hidden select-none md:select-text">

    <header class="bg-slate-950 border-b border-slate-800/80 h-16 flex items-center justify-between px-4 md:px-6 z-20 shrink-0">
        <div class="flex items-center space-x-2 md:space-x-3">
            <!-- Sidebar toggle menu icon -->
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white mr-1 p-1.5 bg-slate-900 rounded-lg border border-slate-800 md:bg-transparent md:border-transparent" title="Toggle Document Explorer">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="bg-gradient-to-tr from-purple-600 to-indigo-600 p-2 rounded-xl shadow-lg shadow-purple-500/20 hidden xs:block">
                <i class="fa-solid fa-graduation-cap text-white text-base"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-sm md:text-lg bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">YT-Notes Studio</h1>
                <p class="text-[9px] md:text-[10px] text-slate-400 font-mono hidden sm:block">Bilingual Science Engine</p>
            </div>
        </div>

        <!-- Toolbar controls -->
        <div class="flex items-center space-x-2">
            <!-- Responsive Settings Gear Button (Only visible on small screen viewports) -->
            <button onclick="toggleMobileSettings()" class="md:hidden text-slate-400 hover:text-white p-2 bg-slate-900 border border-slate-800 rounded-lg transition" title="Toggle Quick Settings">
                <i class="fa-solid fa-gear"></i>
            </button>

            <!-- Desktop View settings bar (Hidden on mobile devices) -->
            <div class="hidden md:flex items-center space-x-2 lg:space-x-3">
                <!-- Theme Accents -->
                <div class="flex items-center space-x-1.5 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                    <button onclick="changeTheme('purple')" class="w-4 h-4 rounded-full bg-purple-500 ring-2 ring-transparent hover:ring-white transition" title="Purple Accent"></button>
                    <button onclick="changeTheme('blue')" class="w-4 h-4 rounded-full bg-blue-500 ring-2 ring-transparent hover:ring-white transition" title="Blue Accent"></button>
                    <button onclick="changeTheme('emerald')" class="w-4 h-4 rounded-full bg-emerald-500 ring-2 ring-transparent hover:ring-white transition" title="Emerald Accent"></button>
                    <button onclick="changeTheme('rose')" class="w-4 h-4 rounded-full bg-rose-500 ring-2 ring-transparent hover:ring-white transition" title="Rose Accent"></button>
                </div>

                <!-- Font Selector -->
                <div class="flex items-center space-x-1 bg-slate-900 px-2 py-1 rounded-lg border border-slate-800">
                    <span class="text-[11px] text-slate-400"><i class="fa-solid fa-font"></i></span>
                    <select id="docFont" onchange="syncSettings('font', 'desktop')" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer p-1">
                        <option value="sans" class="bg-slate-950 text-slate-200">Modern Sans (Inter)</option>
                        <option value="serif" class="bg-slate-950 text-slate-200">Academic Serif (Lora)</option>
                    </select>
                </div>

                <!-- Page settings -->
                <div class="flex items-center space-x-1 bg-slate-900 px-2 py-1 rounded-lg border border-slate-800">
                    <span class="text-[11px] text-slate-400"><i class="fa-solid fa-file-invoice"></i></span>
                    <select id="pageSize" onchange="syncSettings('size', 'desktop')" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer p-1">
                        <option value="a4" class="bg-slate-950 text-slate-200">A4 Page</option>
                        <option value="letter" class="bg-slate-950 text-slate-200">Letter Page</option>
                    </select>
                    <div class="h-4 w-px bg-slate-800"></div>
                    <select id="marginSize" onchange="syncSettings('margin', 'desktop')" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer p-1">
                        <option value="5" class="bg-slate-950 text-slate-200">Very Narrow (5mm)</option>
                        <option value="10" class="bg-slate-950 text-slate-200" selected>Narrow (10mm)</option>
                        <option value="15" class="bg-slate-950 text-slate-200">Compact (15mm)</option>
                        <option value="20" class="bg-slate-950 text-slate-200">Normal (20mm)</option>
                    </select>
                </div>
            </div>

            <!-- Export Buttons -->
            <button onclick="triggerFileDownload()" class="bg-slate-900 hover:bg-slate-800 text-slate-200 p-2 md:px-3 md:py-2 rounded-lg border border-slate-800 hover:border-slate-700 transition flex items-center space-x-1.5" title="Export Markdown File">
                <i class="fa-solid fa-download text-sm"></i>
                <span class="hidden lg:inline text-xs font-semibold">Export MD</span>
            </button>

            <button onclick="generatePDF()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold p-2 md:px-4 md:py-2 rounded-lg shadow-lg shadow-purple-600/20 active:scale-95 transition flex items-center space-x-1.5" title="Download PDF Document">
                <i class="fa-solid fa-file-pdf text-sm"></i>
                <span class="hidden sm:inline text-xs">Download PDF</span>
            </button>
        </div>
    </header>

    <div id="mobile-settings" class="hidden bg-slate-950 border-b border-slate-800 p-4 space-y-4 md:hidden">
        <div class="grid grid-cols-2 gap-3">
            <!-- Theme Accents selection in Mobile -->
            <div class="flex flex-col space-y-1.5">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"><i class="fa-solid fa-palette mr-1"></i> Accent Accent Color</span>
                <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 justify-around">
                    <button onclick="changeTheme('purple')" class="w-5 h-5 rounded-full bg-purple-500 ring-2 ring-transparent hover:ring-white transition" title="Purple"></button>
                    <button onclick="changeTheme('blue')" class="w-5 h-5 rounded-full bg-blue-500 ring-2 ring-transparent hover:ring-white transition" title="Blue"></button>
                    <button onclick="changeTheme('emerald')" class="w-5 h-5 rounded-full bg-emerald-500 ring-2 ring-transparent hover:ring-white transition" title="Emerald"></button>
                    <button onclick="changeTheme('rose')" class="w-5 h-5 rounded-full bg-rose-500 ring-2 ring-transparent hover:ring-white transition" title="Rose"></button>
                </div>
            </div>

            <!-- Font Selector in Mobile -->
            <div class="flex flex-col space-y-1.5">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"><i class="fa-solid fa-font mr-1"></i> Typography</span>
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center">
                    <select id="docFontMobile" onchange="syncSettings('font', 'mobile')" class="w-full bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
                        <option value="sans" class="bg-slate-950 text-slate-200">Modern Sans (Inter)</option>
                        <option value="serif" class="bg-slate-950 text-slate-200">Academic Serif (Lora)</option>
                    </select>
                </div>
            </div>

            <!-- Page Size in Mobile -->
            <div class="flex flex-col space-y-1.5">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"><i class="fa-solid fa-file-invoice mr-1"></i> Page Size</span>
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center">
                    <select id="pageSizeMobile" onchange="syncSettings('size', 'mobile')" class="w-full bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
                        <option value="a4" class="bg-slate-950 text-slate-200">A4 Page</option>
                        <option value="letter" class="bg-slate-950 text-slate-200">Letter Page</option>
                    </select>
                </div>
            </div>

            <!-- Margin Settings in Mobile -->
            <div class="flex flex-col space-y-1.5">
                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider"><i class="fa-solid fa-arrows-left-right mr-1"></i> Margin Sizing</span>
                <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center">
                    <select id="marginSizeMobile" onchange="syncSettings('margin', 'mobile')" class="w-full bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
                        <option value="5" class="bg-slate-950 text-slate-200">Very Narrow (5mm)</option>
                        <option value="10" class="bg-slate-950 text-slate-200" selected>Narrow (10mm)</option>
                        <option value="15" class="bg-slate-950 text-slate-200">Compact (15mm)</option>
                        <option value="20" class="bg-slate-950 text-slate-200">Normal (20mm)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Main dynamic workspace layout -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- Off-canvas drawer backdrop (Only works on mobile screens) -->
        <div id="sidebar-backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/70 z-40 md:hidden backdrop-blur-sm"></div>

        <!-- Column 1: Document Explorer (Collapsible Drawer/Side Panel) -->
        <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 z-50 md:z-10 w-64 transform -translate-x-full md:translate-x-0 bg-panel-sidebar border-r border-slate-800 flex flex-col shrink-0 transition-all duration-300 ease-in-out h-full">
            <!-- Sidebar Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 tracking-wider uppercase"><i class="fa-solid fa-folder-open mr-1"></i> Explorer</span>
                <button onclick="createNewDocument()" class="text-purple-400 hover:text-purple-300 text-xs flex items-center space-x-1 bg-purple-500/10 hover:bg-purple-500/20 px-2 py-1 rounded" title="Create New Note">
                    <i class="fa-solid fa-plus"></i>
                    <span>New</span>
                </button>
            </div>

            <!-- Document List -->
            <div id="document-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Dynamically populated document list -->
            </div>

            <!-- Document Operations/Metadata -->
            <div class="p-4 bg-slate-950 border-t border-slate-800 text-center text-xs text-slate-500 space-y-2">
                <p><i class="fa-solid fa-database mr-1"></i> Local Auto-Sync Active</p>
                <div class="flex items-center justify-around">
                    <button onclick="triggerFileInput()" class="text-purple-400 hover:text-purple-300 flex items-center space-x-1">
                        <i class="fa-solid fa-file-import"></i>
                        <span>Import MD</span>
                    </button>
                    <input type="file" id="fileImportInput" accept=".md,.txt" class="hidden" onchange="importMarkdownFile(event)">
                </div>
            </div>
        </aside>

        <!-- Column 2: Advanced Markdown Editor Panel -->
        <section id="editor-section" class="flex-1 flex flex-col h-full bg-panel-editor border-r border-slate-800 transition-all duration-300">
            <!-- Editor Toolbar Controls -->
            <div class="bg-slate-900/90 px-3 py-2 border-b border-slate-800/80 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2.5 overflow-x-auto py-1 scrollbar-thin">
                    <button onclick="insertMarkdown('bold')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Bold"><i class="fa-solid fa-bold"></i></button>
                    <button onclick="insertMarkdown('italic')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Italic"><i class="fa-solid fa-italic"></i></button>
                    <button onclick="insertMarkdown('header')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Heading"><i class="fa-solid fa-heading"></i></button>
                    <div class="h-4 w-px bg-slate-800 shrink-0"></div>
                    <button onclick="insertMarkdown('blockquote')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Blockquote"><i class="fa-solid fa-quote-left"></i></button>
                    <button onclick="insertMarkdown('table')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Table"><i class="fa-solid fa-table"></i></button>
                    <button onclick="insertMarkdown('code')" class="text-slate-400 hover:text-white px-2 py-1 text-xs" title="Code block"><i class="fa-solid fa-code"></i></button>
                    <div class="h-4 w-px bg-slate-800 shrink-0"></div>
                    <button onclick="insertMarkdown('math')" class="text-purple-400 hover:text-purple-200 px-2 py-1 text-xs font-bold shrink-0" title="LaTeX Equation"><i class="fa-solid fa-calculator"></i> Math</button>
                    <button onclick="insertMarkdown('mermaid')" class="text-blue-400 hover:text-blue-200 px-2 py-1 text-xs font-bold shrink-0" title="Mermaid Flowchart"><i class="fa-solid fa-diagram-project"></i> Diagram</button>
                </div>
            </div>

            <!-- Raw Text Editor Area -->
            <div class="flex-1 relative">
                <textarea id="editor" oninput="handleEditorInput()" class="absolute inset-0 w-full h-full p-4 md:p-6 bg-slate-950/40 text-slate-300 font-mono text-xs md:text-sm leading-relaxed focus:outline-none resize-none overflow-y-auto border-0 focus:ring-0" placeholder="Type or paste your Markdown here..."></textarea>
            </div>

            <!-- Word & Character Status Indicator -->
            <div class="bg-slate-900 px-4 py-2 flex justify-between text-[10px] md:text-[11px] text-slate-500 font-mono border-t border-slate-800/80 mb-14 md:mb-0 shrink-0">
                <span id="docStatus">Status: Synchronized</span>
                <span id="charCount">0 characters | 0 words</span>
            </div>
        </section>

        <!-- Column 3: WYSIWYG Live Preview Panel -->
        <section id="preview-section" class="w-full md:w-[45%] lg:w-[48%] xl:w-[45%] hidden md:flex flex-col h-full bg-slate-900/60 overflow-hidden">
            <div class="bg-slate-900/80 px-4 py-2 border-b border-slate-800 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Live Rendered Document</span>
                </div>
                <span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded text-[9px] md:text-[10px] font-semibold">Engine Ready</span>
            </div>

            <!-- Live Compiled Web Frame Container -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6 flex justify-center bg-slate-900/40" id="preview-container">
                <div id="preview-sheet" class="pdf-page-preview rounded-sm relative markdown-body font-style-sans">
                    <!-- Dynamic math diagrams text content will compile here -->
                </div>
            </div>
        </section>

        <div class="md:hidden fixed bottom-4 right-4 z-40 flex bg-slate-950/90 border border-slate-800 rounded-full p-1.5 shadow-2xl backdrop-blur-md">
            <button onclick="setMobileView('editor')" id="btn-tab-editor" class="px-4 py-2 rounded-full text-xs font-semibold transition bg-purple-600 text-white flex items-center space-x-1.5">
                <i class="fa-solid fa-pen"></i>
                <span>Edit</span>
            </button>
            <button onclick="setMobileView('preview')" id="btn-tab-preview" class="px-4 py-2 rounded-full text-xs font-semibold transition text-slate-400 flex items-center space-x-1.5">
                <i class="fa-solid fa-eye"></i>
                <span>Preview</span>
            </button>
        </div>
    </main>

    <script>
        let debounceTimer;
        
        function handleEditorInput() {
            document.getElementById('docStatus').textContent = "Typing...";
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const activeDoc = documents.find(d => d.id === currentDocId);
                if (activeDoc) {
                    activeDoc.content = document.getElementById('editor').value;
                    activeDoc.updatedAt = Date.now();

                saveDocumentsToStorage();
                updatePreview();
                document.getElementById('docStatus').textContent = "Synchronized";
            }, 350);
        }

        // Custom parser wrapper for Subscript, Superscript and KaTeX extraction
        function compileAdvancedMarkdown(rawText) {
            let processed = rawText;

            // 1. Highlight extraction: ==highlight== -> <mark>
            processed = processed.replace(/==([\s\S]+?)==/g, '<mark class="bg-yellow-200 text-slate-900 px-1.5 rounded-sm font-semibold">$1</mark>');

            // 2. Subscript & Superscript replacements
            processed = processed.replace(/~([\s\S]+?)~/g, '<sub>$1</sub>');
            processed = processed.replace(/\^([\s\S]+?)\^/g, '<sup>$1</sup>');

            // 3. LaTeX Math extraction
            const mathBlocks = [];
            const inlineMath = [];

            // Block Math: $$ ... $$
            processed = processed.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, (match, formula) => {
                const placeholder = `%%BLOCK_MATH_PLACEHOLDER_${mathBlocks.length}%%`;
                mathBlocks.push(formula);
                return placeholder;
            });

            // Inline Math: $ ... $
            processed = processed.replace(/\$(.+?)\$/g, (match, formula) => {
                const placeholder = `%%INLINE_MATH_PLACEHOLDER_${inlineMath.length}%%`;
                inlineMath.push(formula);
                return placeholder;
            });

            // 4. Compile standard markdown
            let compiledHtml = marked.parse(processed);

            // 5. Inject KaTeX back
            mathBlocks.forEach((formula, idx) => {
                try {
                    const mathHtml = katex.renderToString(formula, { displayMode: true, throwOnError: false });
                    compiledHtml = compiledHtml.replace(`%%BLOCK_MATH_PLACEHOLDER_${idx}%%`, mathHtml);
                } catch(e) {
                    compiledHtml = compiledHtml.replace(`%%BLOCK_MATH_PLACEHOLDER_${idx}%%`, `<span class="text-rose-600 font-mono text-xs">LaTeX Error: ${e.message}</span>`);
                }
            });

            inlineMath.forEach((formula, idx) => {
                try {
                    const mathHtml = katex.renderToString(formula, { displayMode: false, throwOnError: false });
                    compiledHtml = compiledHtml.replace(`%%INLINE_MATH_PLACEHOLDER_${idx}%%`, mathHtml);
                } catch(e) {
                    compiledHtml = compiledHtml.replace(`%%INLINE_MATH_PLACEHOLDER_${idx}%%`, `<span class="text-rose-600 font-mono text-[10px]">Error: ${e.message}</span>`);
                }
            });

            return compiledHtml;
        }

        async function updatePreview() {
            const editorValue = document.getElementById('editor').value;
            const previewSheet = document.getElementById('preview-sheet');
            
            // Render word counts
            const charCount = editorValue.length;
            const wordCount = editorValue.trim() === '' ? 0 : editorValue.trim().split(/\s+/).length;
            document.getElementById('charCount').textContent = `${charCount} characters | ${wordCount} words`;

            // Compile
            const outputHtml = compileAdvancedMarkdown(editorValue);
            previewSheet.innerHTML = outputHtml;

            // Align Layout selections dynamically
            const docFont = document.getElementById('docFont').value;
            if (docFont === 'serif') {
                previewSheet.className = "pdf-page-preview rounded-sm relative markdown-body font-style-serif";
            } else {
                previewSheet.className = "pdf-page-preview rounded-sm relative markdown-body font-style-sans";
            }

            const pageSize = document.getElementById('pageSize').value;
            const marginSize = document.getElementById('marginSize').value;

            // Only enforce fixed paper width on desktop viewports to avoid mobile overflow
            if (window.innerWidth >= 768) {
                if (pageSize === 'letter') {
                    previewSheet.style.width = '215.9mm';
                    previewSheet.style.minHeight = '279.4mm';
                } else { // Standard A4 Size
                    previewSheet.style.width = '210mm';
                    previewSheet.style.minHeight = '297mm';
                }
                previewSheet.style.padding = `${marginSize}mm`;
            } else {
                // Adaptive size styling on mobile
                previewSheet.style.width = '100%';
                previewSheet.style.minHeight = 'auto';
                previewSheet.style.padding = '15px';
            }

            // Highlighting code snippets
            previewSheet.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            // Mermaid diagrams processing
            await renderMermaidDiagrams();
        }

        async function renderMermaidDiagrams() {
            const previewSheet = document.getElementById('preview-sheet');
            const codeBlocks = previewSheet.querySelectorAll('pre code.language-mermaid');
            
            for (let i = 0; i < codeBlocks.length; i++) {
                const block = codeBlocks[i];
                const preElement = block.parentElement;
                const diagramDefinition = block.textContent;

                const wrapperId = `mermaid-container-${i}`;
                const diagramContainer = document.createElement('div');
                diagramContainer.id = wrapperId;
                diagramContainer.className = 'mermaid flex justify-center py-3 bg-white rounded-lg border border-slate-100 my-4 overflow-x-auto';
                
                preElement.replaceWith(diagramContainer);

                try {
                    const { svg } = await mermaid.render(`mermaid-svg-${i}`, diagramDefinition);
                    diagramContainer.innerHTML = svg;
                } catch (error) {
                    console.error("Mermaid parsing failed: ", error);
                    diagramContainer.innerHTML = `<div class="p-3 text-xs text-rose-600 font-mono bg-rose-50 rounded-lg">Mermaid Syntax Error:<br>${error.message}</div>`;
                    mermaid.mermaidAPI.parseError = function(err, hash) {};
                }
            }
        }
    </script>

    <script>
        let currentThemeColor = '#a855f7'; // Purple Accent Color Hex
        
        function changeTheme(color) {
            let accentHex = '#a855f7';
            let bgLight = '#faf5ff';
            let textDeep = '#581c87';

            switch (color) {
                case 'blue':
                    accentHex = '#2563eb';
                    bgLight = '#eff6ff';
                    textDeep = '#1e3a8a';
                    break;
                case 'emerald':
                    accentHex = '#10b981';
                    bgLight = '#ecfdf5';
                    textDeep = '#064e3b';
                    break;
                case 'rose':
                    accentHex = '#f43f5e';
                    bgLight = '#fff1f2';
                    textDeep = '#881337';
                    break;
                case 'purple':
                default:
                    accentHex = '#a855f7';
                    bgLight = '#faf5ff';
                    textDeep = '#581c87';
                    break;
            }

            currentThemeColor = accentHex;

            let styleEl = document.getElementById('dynamic-theme-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'dynamic-theme-style';
                document.head.appendChild(styleEl);
            }

            styleEl.innerHTML = `
                .markdown-body blockquote {
                    border-left-color: ${accentHex} !important;
                    background-color: ${bgLight} !important;
                    color: ${textDeep} !important;
                }
                .markdown-body h1 {
                    border-bottom-color: ${accentHex}30 !important;
                }
            `;
        }

        // Inserting markdown symbols at cursor position
        function insertMarkdown(type) {
            const editor = document.getElementById('editor');
            const startPos = editor.selectionStart;
            const endPos = editor.selectionEnd;
            const text = editor.value;
            const selectedText = text.substring(startPos, endPos);
            
            let inserted = "";

            switch(type) {
                case 'bold':
                    inserted = `**${selectedText || "bold text"}**`;
                    break;
                case 'italic':
                    inserted = `*${selectedText || "italic text"}*`;
                    break;
                case 'header':
                    inserted = `\n## ${selectedText || "New Heading"}\n`;
                    break;
                case 'blockquote':
                    inserted = `\n> ${selectedText || "Quote Text"}\n`;
                    break;
                case 'table':
                    inserted = `\n| Column 1 | Column 2 |\n| :--- | :--- |\n| Cell 1 | Cell 2 |\n`;
                    break;
                case 'code':
                    inserted = `\n\`\`\`javascript\n${selectedText || "// Insert your code here"}\n\`\`\`\n`;
                    break;
                case 'math':
                    inserted = `\n$$\nx = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}\n$$\n`;
                    break;
                case 'mermaid':
                    inserted = `\n\`\`\`mermaid\nflowchart TD\n    Start --> Process\n    Process --> End\n\`\`\`\n`;
                    break;
            }

            editor.value = text.substring(0, startPos) + inserted + text.substring(endPos);
            editor.focus();
            editor.selectionStart = startPos + inserted.length;
            editor.selectionEnd = startPos + inserted.length;
            
            handleEditorInput();
        }
    </script>

    <script>
        let modalResolve = null;

        function showConfirmModal(title, message, confirmText = "Confirm", confirmColor = "bg-purple-600 hover:bg-purple-500 shadow-purple-600/20") {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            const iconContainer = document.getElementById('modal-icon-container');
            iconContainer.innerHTML = '<i class="fa-solid fa-circle-question text-3xl animate-bounce"></i>';
            iconContainer.className = "flex items-center space-x-3 text-purple-400 mb-4";

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.textContent = confirmText;
            confirmBtn.className = `px-4 py-2 ${confirmColor} text-white rounded-xl text-xs md:text-sm font-semibold transition shadow-lg`;

            document.getElementById('modal-input-container').classList.add('hidden');
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');

            return new Promise((resolve) => {
                modalResolve = (val) => {
                    modal.classList.add('hidden');
                    resolve(val);
                };
            });
        }

        function showPromptModal(title, message, defaultValue = "") {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            
            const iconContainer = document.getElementById('modal-icon-container');
            iconContainer.innerHTML = '<i class="fa-solid fa-file-pen text-3xl"></i>';
            iconContainer.className = "flex items-center space-x-3 text-purple-400 mb-4";

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.textContent = "Proceed";
            confirmBtn.className = "px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs md:text-sm font-semibold transition shadow-lg shadow-purple-600/20";

            const inputField = document.getElementById('modal-text-input');
            inputField.value = defaultValue;
            
            document.getElementById('modal-input-container').classList.remove('hidden');
            const modal = document.getElementById('custom-modal');
            modal.classList.remove('hidden');
            inputField.focus();

            return new Promise((resolve) => {
                modalResolve = (val) => {
                    modal.classList.add('hidden');
                    if (val) {
                        resolve(inputField.value);
                    } else {
                        resolve(null);
                    }
                };
            });
        }

        // Cancel dialog trigger
        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            if (modalResolve) modalResolve(false);
        });

        // Confirm dialog trigger
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if (modalResolve) modalResolve(true);
        });

        // Trigger file input dialog
        function triggerFileInput() {
            document.getElementById('fileImportInput').click();
        }

        function importMarkdownFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const documentTitle = file.name.replace(/\.[^/.]+$/, "");

                const newId = 'imported-' + Date.now();
                const importedDoc = {
                    id: newId,
                    title: documentTitle,
                    content: text,
                    updatedAt: Date.now()
                };

                documents.push(importedDoc);
                currentDocId = newId;

                saveDocumentsToStorage();
                renderExplorerList();

                document.getElementById('editor').value = text;
                updatePreview();

                document.getElementById('fileImportInput').value = "";
            };
            reader.readAsText(file);
        }

        // Export active note as Markdown .md file download
        function triggerFileDownload() {
            const doc = getDocumentById(currentDocId);
            const safeTitle = doc.title.trim().replace(/[^a-z0-9a-z]/gi, '_').toLowerCase();
            const blob = new Blob([doc.content], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.download = `${safeTitle}.md`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

    <script>
        function generatePDF() {
            const previewSheet = document.getElementById('preview-sheet');
            const pageSize = document.getElementById('pageSize').value;
            const marginSizeValue = parseInt(document.getElementById('marginSize').value, 10);
            const doc = getDocumentById(currentDocId);

            // Fetch active print action buttons to render loading spinner
            const downloadBtn = document.querySelector('button[title="Download PDF Document"]');
            const oldHtml = downloadBtn.innerHTML;
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span class="hidden sm:inline">Rendering...</span>`;

            // Reset dynamic styles for printing engine calculations
            const originalPadding = previewSheet.style.padding;
            const originalWidth = previewSheet.style.width;
            const originalMinHeight = previewSheet.style.minHeight;

            // Enforce standard paper parameters temporarily during compilation
            if (pageSize === 'letter') {
                previewSheet.style.width = '215.9mm';
                previewSheet.style.minHeight = '279.4mm';
            } else {
                previewSheet.style.width = '210mm';
                previewSheet.style.minHeight = '297mm';
            }
            previewSheet.style.padding = '0mm'; // clear dynamic padding so margins sync flawlessly

            const opt = {
                margin:       marginSizeValue, // native margins
                filename:     `${doc.title.replace(/[^a-z0-9a-z]/gi, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2.5, // Crisp high-definition print quality
                    useCORS: true, 
                    logging: false,
                    letterRendering: true
                },
                jsPDF:        { 
                    unit: 'mm', 
                    format: pageSize === 'letter' ? 'letter' : 'a4', 
                    orientation: 'portrait' 
                },
                pagebreak: { 
                    mode: ['css', 'legacy'], 
                    avoid: ['tr', 'pre', 'blockquote', 'h1', 'h2', 'h3', 'li', 'p', '.katex-display', '.mermaid'] 
                }
            };

            // Run HTML to PDF compiler
            html2pdf().set(opt).from(previewSheet).save().then(() => {
                // Restore paper preview sizing classes
                previewSheet.style.padding = originalPadding;
                previewSheet.style.width = originalWidth;
                previewSheet.style.minHeight = originalMinHeight;
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = oldHtml;
            }).catch(err => {
                console.error("PDF Compiling failed: ", err);
                previewSheet.style.padding = originalPadding;
                previewSheet.style.width = originalWidth;
                previewSheet.style.minHeight = originalMinHeight;
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = oldHtml;
            });
        }
    </script>
</body>
